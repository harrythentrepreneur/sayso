name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# Maintainers' commits and same-repo PRs run on the shared self-hosted pool (ephemeral,
# non-root container, no secrets; GitHub-hosted runners are blocked by account billing).
# A PR from a FORK never runs on the pool: this is a public repo, and fork code must not
# execute on the maintainers' machine. Fork PRs use GitHub-hosted runners instead.
jobs:
  test:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","ci-shared"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ${{ matrix.python }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq wamerican
          fi
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-python"
          uv --version >/dev/null 2>&1 || pip install -q uv
          uv venv -q -p ${{ matrix.python }} "$RUNNER_TEMP/venv"
          # Test-only: the CommonMark cross-check in tests/test_qa_markdown.py skips without it,
          # and one seeded fault is killed only by that check. sayso itself stays zero-dependency.
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install -q markdown-it-py==3.0.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Word list present (privacy masking reads /usr/share/dict/words)
        run: test -s /usr/share/dict/words && python --version
      - name: Unit, workflow, adapter, quickstart and docs tests (fakes only)
        run: python -m unittest discover -s tests -t . -v
      - name: Stable API (what Sayso Cloud builds on)
        run: python scripts/stable_api.py
      - name: End-to-end demo
        run: python -m sayso.cli demo
      - name: Example settings validate
        run: python -m sayso.cli validate --config examples/acme-dry-run.toml

  # Seeded-fault proof, split in two halves that run at the same time (one per pool runner).
  # A mutation tests the guards, not the interpreter, so it runs on 3.12 only. 344 mutants
  # in one job took ~2 h 40 min against a 3 h limit (19 Oct 2026).
  mutate:
    needs: test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","ci-shared"]') || 'ubuntu-latest' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq wamerican
          fi
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/uv-python"
          uv --version >/dev/null 2>&1 || pip install -q uv
          uv venv -q -p 3.12 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install -q markdown-it-py==3.0.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Seeded-fault proof, shard ${{ matrix.shard }} (every guard must fail a test when removed)
        env:
          MUTATE_JOBS: "4"
          MUTATE_SHARD: ${{ matrix.shard }}
        run: |
          python scripts/mutate.py | tee mutate.log
          grep -q '^MUTATION VERDICT: PASS' mutate.log
